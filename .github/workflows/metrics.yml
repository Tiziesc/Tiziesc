name: Métricas del perfil

on:
  schedule:
    - cron: "30 6 * * *"  # 03:30 en Argentina, después del gráfico de líneas
  workflow_dispatch:

permissions:
  contents: write

concurrency: perfil  # misma cola que ticker.yml: nunca empujan a la vez

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_PAT }}
          filename: charts/metrics.svg
          committer_message: "Actualizar las métricas del perfil"

          # Sin la cabecera de usuario; 960 px de ancho, el del README
          base: ""
          config_display: large
          config_timezone: America/Argentina/Buenos_Aires
          config_order: habits, languages, stargazers, topics

          # Repos propios y de colaboración, con los nombres con que firmás los commits
          repositories_affiliations: owner, collaborator
          commits_authoring: Tiziesc, Tiziano Escalante

          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

          plugin_stargazers: yes

          plugin_topics: yes
          plugin_topics_mode: mastered
