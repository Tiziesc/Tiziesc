name: Métricas del perfil

on:
  schedule:
    - cron: "30 6 * * *"  # 03:30 en Argentina, después del gráfico de líneas
  workflow_dispatch:
  push:  # un cambio en el script o en los workflows regenera los gráficos al subirlo
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]

permissions:
  contents: write

concurrency: perfil  # misma cola que ticker.yml: nunca empujan a la vez

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_PAT }}
          filename: charts/metrics.svg
          committer_message: "Actualizar las métricas del perfil"

          # Sin la cabecera de usuario; 960 px de ancho, el del README
          base: ""
          config_display: large
          config_timezone: America/Argentina/Buenos_Aires
          config_order: languages, stargazers, topics

          # Repos propios y de colaboración, públicos y privados
          repositories_affiliations: owner, collaborator

          # Peso en bytes que GitHub calcula para cada repo, como en el original.
          # Sin plugin_languages_indepth: ese modo ignora los repos privados (lowlighter/metrics#1072)
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

          # Sin plugin_habits: GitHub ya no manda los commits en los eventos de push
          # y el plugin falla siempre con «Unexpected error»

          plugin_stargazers: yes

          plugin_topics: yes
          plugin_topics_mode: mastered
